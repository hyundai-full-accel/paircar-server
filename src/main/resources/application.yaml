spring:
  application:
    name: paircar-server
  docker:
    compose:
      # bootRun 때 로컬 PostgreSQL을 자동으로 띄움 (spring-boot-docker-compose, 개발 전용)
      file: infra/compose.local.yaml
  jackson:
    deserialization:
      # JSON에 숫자 필드가 빠지면 0으로 채우지 않고 실패시킴 (Odometer 0 같은 값이 조용히 저장되는 것 방지)
      fail-on-null-for-primitives: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway(db/migration)만 바꿈. 엔티티와 어긋나면 기동 실패
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  # nginx 게이트웨이가 보낸 X-Forwarded-* 헤더로 원래 주소, 프로토콜을 복원 (Swagger 서버 주소, 리다이렉트)
  forward-headers-strategy: framework

logging:
  pattern:
    # 로그 줄마다 요청 ID, 멤버 ID (global/logging/RequestLoggingFilter). 요청 밖 작업은 req=job:이름
    level: "%5p [req=%X{requestId:-} m=%X{memberId:-}]"

springdoc:
  # API 문서에는 /api만 (헬스체크, 테스트용 컨트롤러 제외)
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health # 컨테이너 헬스체크용. 다른 엔드포인트는 열지 않음
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness, /actuator/health/readiness

paircar:
  cors:
    # 동승자 웹 주소 (서버와 따로 배포). 쉼표로 여러 개. 끝에 / 없이
    allowed-origins: ${PAIRCAR_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  invite:
    # 동승자 웹의 초대 참여 경로. 초대 링크 = base-url + "/" + code
    base-url: ${PAIRCAR_INVITE_BASE_URL:http://localhost:3000/join}
  push:
    # Web Push VAPID 키 (base64url). 둘 중 하나라도 비어 있으면 Push를 보내지 않음 (SSE는 그대로 동작)
    # 키 만들기: npx web-push generate-vapid-keys
    public-key: ${PAIRCAR_VAPID_PUBLIC_KEY:}
    private-key: ${PAIRCAR_VAPID_PRIVATE_KEY:}
    subject: ${PAIRCAR_VAPID_SUBJECT:mailto:admin@paircar.app}
