<text x="750.0" y="227.0" font-size="13" font-weight="400" fill="#fff" text-anchor="middle">얻어 타고 한 달 기름값을 보냄</text>
<rect x="330" y="330" width="340" height="130" rx="10" fill="#1168bd" stroke="#0b4884" stroke-width="2"/>
