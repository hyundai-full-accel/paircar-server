# upstream, 요청 제한 영역 (http 컨텍스트). 서버 블록 파일에서 한 번만 include
# 이름에 밑줄을 쓰지 않음: Host 헤더를 따로 정하지 않은 요청은 이 이름이 Host로 가는데, Tomcat은 밑줄 든 호스트를 400으로 거부함
upstream paircar-app {
    server app:8080;
    keepalive 32;
}

# 요청 제한 (IP 기준)
# api: 차량 앱은 운행 중 5~10초마다 위치를 보내므로 넉넉하게
# invite: 초대 코드 무작위 대입 방지
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=invite:10m rate=10r/m;
limit_req_status 429;

# 접근 로그에 요청 ID($request_id)를 남김. 서버로도 X-Request-Id로 넘겨 서버 로그의 req=와 같은 값이 됨
log_format paircar '$remote_addr [$time_local] "$request" $status $body_bytes_sent ${request_time}s rid=$request_id';
