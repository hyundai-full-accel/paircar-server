# nginx 게이트웨이 + 서버 + PostgreSQL 전체 실행 (시연, 배포용)
# 외부로 열리는 포트는 nginx 하나뿐. 서버와 DB는 내부 네트워크에만 있음
# 실행: cp infra/.env.example infra/.env 후 값 채우고
#       docker compose -f infra/compose.yaml up -d --build --wait   (--wait: 모두 healthy가 될 때까지 기다림)
name: paircar

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paircar}
      POSTGRES_USER: ${POSTGRES_USER:-paircar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 infra/.env에 설정하세요}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # DB 포트는 밖으로 열지 않음. 서버 컨테이너만 접근

  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: paircar-server:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-paircar}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-paircar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PAIRCAR_INVITE_BASE_URL: ${PAIRCAR_INVITE_BASE_URL:-http://localhost:3000/join}
      PAIRCAR_VAPID_PUBLIC_KEY: ${PAIRCAR_VAPID_PUBLIC_KEY:-}
      PAIRCAR_VAPID_PRIVATE_KEY: ${PAIRCAR_VAPID_PRIVATE_KEY:-}
      PAIRCAR_VAPID_SUBJECT: ${PAIRCAR_VAPID_SUBJECT:-mailto:admin@paircar.app}
    # 포트를 밖으로 열지 않음. nginx를 거쳐서만 접근
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/paircar.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      # localhost는 IPv6(::1)로 풀려 연결이 거부되므로 127.0.0.1로 확인
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  postgres-data:
