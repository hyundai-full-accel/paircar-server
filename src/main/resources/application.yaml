spring:
  application:
    name: paircar-server
  jackson:
    deserialization:
      # JSON에 숫자 필드가 빠지면 0으로 채우지 않고 실패시킴 (Odometer 0 같은 값이 조용히 저장되는 것 방지)
      fail-on-null-for-primitives: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none # Flyway 도입 후 validate로 변경
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
