# 서버 블록 안에서 include하는 공통 설정 (HTTP, HTTPS 공통)
# - /api/*              → 서버 (SSE 구독은 버퍼링 없이 스트리밍)
# - /swagger-ui, /v3    → 서버 (API 문서)
# - /actuator/health    → 서버 (헬스체크만 공개)
# - 그 밖의 경로          → 404 (동승자 웹을 붙일 자리)

client_max_body_size 2m; # 운행 경로(route_polyline) 업로드 여유
server_tokens off;

gzip on;
gzip_types application/json;
gzip_min_length 1024;

proxy_http_version 1.1;
proxy_set_header Connection "";
# $http_host는 클라이언트가 보낸 포트까지 포함 (호스트 포트가 80이 아니어도 Swagger 주소가 맞게 나옴)
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
# 요청 ID: 클라이언트가 보낸 값은 쓰지 않고 nginx가 만든 값으로 덮음 (서버 로그 req=와 nginx 로그 rid=가 같음)
proxy_set_header X-Request-Id $request_id;

access_log /var/log/nginx/access.log paircar;

# 실시간 구독 (SSE): 버퍼링을 끄고 오래 열어 둠. 서버가 25초마다 keepalive를 보냄
location = /api/live/events {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://paircar-app;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 1h;
}

# 초대 코드 조회, 참여: 분당 10회
location /api/invites/ {
    limit_req zone=invite burst=5 nodelay;
    proxy_pass http://paircar-app;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    proxy_pass http://paircar-app;
}

location /swagger-ui {
    proxy_pass http://paircar-app;
}

location /v3/api-docs {
    proxy_pass http://paircar-app;
}

location /actuator/health {
    proxy_pass http://paircar-app;
}

location / {
    default_type application/json;
    return 404 '{"success":false,"error":{"code":"RESOURCE_NOT_FOUND","message":"요청한 리소스를 찾을 수 없습니다."}}';
}

# 게이트웨이에서 생기는 오류도 서버와 같은 응답 형식으로
error_page 429 = @too_many_requests;
error_page 502 503 504 = @unavailable;

location @too_many_requests {
    default_type application/json;
    return 429 '{"success":false,"error":{"code":"TOO_MANY_REQUESTS","message":"요청이 너무 많습니다. 잠시 뒤 다시 시도해 주세요."}}';
}

location @unavailable {
    default_type application/json;
    return 503 '{"success":false,"error":{"code":"SERVICE_UNAVAILABLE","message":"서버를 잠시 사용할 수 없습니다. 잠시 뒤 다시 시도해 주세요."}}';
}
